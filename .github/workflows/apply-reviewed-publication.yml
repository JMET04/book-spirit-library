name: Apply reviewed publication snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned payload and apply reviewed files
        env:
          PUBLICATION_SHA: "073875a7eb3cd3a02a14aeeafe84caa5388f76c02edbf31cf0c6ea3294aa1e93"
          PUBLICATION_PARTS: '[{"name":"payload.part001","bytes":20971520,"sha256":"6192da20588603089ad76c3f59e29971a1c3c0b79fb10441979375d1529df026"},{"name":"payload.part002","bytes":20971520,"sha256":"a5471cbcac68c6a4527c1d038fb3e25ee9cc4c398811732273c31a42caad55d9"},{"name":"payload.part003","bytes":13065102,"sha256":"5f008cee51e1e9d9e9df8f7d1a8eec4a27f49587c52e18e2261f5b3d02dd3899"}]'
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, os, zipfile

          root = Path.cwd()
          parts = json.loads(os.environ['PUBLICATION_PARTS'])
          payload = bytearray()
          for item in parts:
              data = (root / '.publication' / item['name']).read_bytes()
              assert len(data) == item['bytes'], 'Part size mismatch'
              assert hashlib.sha256(data).hexdigest() == item['sha256'], 'Part hash mismatch'
              payload.extend(data)
          assert hashlib.sha256(payload).hexdigest() == os.environ['PUBLICATION_SHA'], 'Payload hash mismatch'
          def safe(name):
              p = PurePosixPath(name)
              assert not p.is_absolute() and name == p.as_posix(), 'Non-canonical path'
              assert all(x not in ('', '.', '..') for x in p.parts), 'Unsafe path'
              assert p.parts[0] not in ('.git', '.github', '.publication'), 'Protected path'
              assert '\\' not in name and ':' not in name, 'Unsafe separator'
              return root.joinpath(*p.parts)
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              plan = json.loads(archive.read('publication-manifest.json'))
              assert plan['format'] == 'reviewed-publication-v1'
              expected = {item['path']: item for item in plan['files']}
              assert len(expected) == len(plan['files']), 'Duplicate manifest entry'
              assert len(archive.namelist()) == len(set(archive.namelist())), 'Duplicate archive entry'
              assert set(archive.namelist()) == set(expected) | {'publication-manifest.json'}, 'Unexpected member'
              assert sum(i.file_size for i in archive.infolist()) < 256 * 1024 * 1024, 'Payload too large'
              # Validate everything before writing or deleting anything.
              for name, item in expected.items():
                  dest = safe(name)
                  assert not dest.is_symlink(), 'Symlink destination'
                  data = archive.read(name)
                  assert len(data) == item['bytes'] and hashlib.sha256(data).hexdigest() == item['sha256'], name
              for name in plan['delete']:
                  safe(name)
                  assert name.startswith('final-exam-study-coach/'), 'Deletion outside obsolete skill directory'
              for name in plan['delete']:
                  dest = safe(name)
                  if dest.exists():
                      assert dest.is_file() and not dest.is_symlink(), 'Deletion must be a normal file'
                      dest.unlink()
              for name in expected:
                  dest = safe(name)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(archive.read(name))
          for item in parts:
              (root / '.publication' / item['name']).unlink()
          print(json.dumps({'applied_files': len(expected), 'deleted_old_files': len(plan['delete']), 'payload_sha256': os.environ['PUBLICATION_SHA']}))
          PY
      - run: python scripts/book_asset.py validate-catalog .
      - name: Commit verified publication without force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish reviewed 2026-11-26 plugin and book assets"
          git push origin HEAD:main
